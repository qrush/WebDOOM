<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebDOOM — 10 Year Tribute (test)</title>
    <link rel="stylesheet" type="text/css" href="./tribute.css?b=34" />
    <!-- must run BEFORE doom1.js so the WebGL hook is installed
         before the game creates its context -->
    <script type="text/javascript" src="./tribute.js?b=34"></script>
  </head>

  <body>
    <div id="stage">
      <canvas id="doom" oncontextmenu="event.preventDefault()"></canvas>
      <div id="loader"><span>Loading DOOM…</span> <span id="progress">0.0%</span></div>
    </div>

    <script type="text/javascript">
      window.Module = {
        canvas: document.getElementById('doom'),
        progress: document.getElementById('progress'),
        loader: document.getElementById('loader'),

        // -file tribute.wad : load our custom PWAD (prboom supports this
        //   natively -- src/d_main.c:1037 -- so no engine rebuild needed)
        // NOTE: we deliberately run the SOFTWARE renderer here.
        //   src/m_misc.c:308-313 defaults videomode to "8" on non-MSVC builds,
        //   so no WebGL context is ever created -- which is why the earlier
        //   texture-streaming hook saw zero texImage2D calls. Forcing
        //   `-vidmode gl` does reach the GL renderer (after patching a crash
        //   and a throwing glTexGenfv stub -- see make-gl-build.py), but
        //   emscripten's legacy GL emulation then renders an all-black frame,
        //   so GL is not a usable path in this prebuilt engine.
        // -warp 1 1 boots straight into E1M1 (our octagon), skipping the
        //   title screen, the attract-mode demos and the menus entirely.
        //   That also sidesteps prboom's screen-melt (D_Wipe, src/d_main.c:172),
        //   which runs its whole animation inside a single blocking main-loop
        //   call and makes the page unresponsive on every state transition.
        // -skill 2 is "Hurt Me Plenty"; irrelevant here (no monsters) but it
        //   stops the skill menu appearing.
        // -geom 960x540 renders natively at 16:9 so fullscreen has no black
        //   bars (the 640x480 default is 4:3). Kept at 540p deliberately:
        //   this is DOOM's SOFTWARE renderer, so cost scales with pixel count,
        //   and 1280x720 (3x the pixels of 640x480) starved the frame loop
        //   badly enough that the page stopped responding to rAF at all.
        // -window keeps SDL windowed; we do fullscreen ourselves via the DOM
        //   so the canvas can scale with correct aspect and grab pointer lock.
        arguments: ['-file', 'tribute.wad', '-warp', '1', '1', '-skill', '2',
                    '-geom', '960x540', '-window'],

        preRun: [function () {
          Module.addRunDependency('tribute-wad');
          fetch('tribute.wad', { cache: 'no-cache' })
            .then(function (r) {
              if (!r.ok) throw new Error('HTTP ' + r.status);
              return r.arrayBuffer();
            })
            .then(function (buf) {
              FS.createDataFile('/', 'tribute.wad', new Uint8Array(buf), true, true, true);
              if (window.__tributeGameLog) {
                window.__tributeGameLog('[harness] tribute.wad written, ' + buf.byteLength + ' bytes');
              }
              Module.removeRunDependency('tribute-wad');
            })
            .catch(function (e) {
              document.getElementById('loader').textContent = 'Failed to load tribute.wad: ' + e.message;
            });
        }],

        // surface the engine's own stdout/stderr -- this is ground truth for
        // which WADs loaded and which video mode it actually selected
        print: function (t) { if (window.__tributeGameLog) window.__tributeGameLog(t); },
        printErr: function (t) { if (window.__tributeGameLog) window.__tributeGameLog('! ' + t); },

        setStatus: function (status) {
          var m = status.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          if (!m) { if (!status) this.loader.classList.add('done'); return; }
          var pct = m[2] / m[4] * 100;
          this.progress.textContent = pct.toFixed(1) + '%';
          if (pct === 100) setTimeout(function () {
            Module.loader.classList.add('done');
          }, 400);
        },
        monitorRunDependencies: function () {}
      };
    </script>
    <!-- tribute-engine.js is doom1.js with the file-package manifest rewritten
         to point at tribute.data: the same engine, but without the 90MB of
         music the engine cannot load anyway. Regenerate with
         `python3 tools/repack_data.py`. -->
    <script type="text/javascript" src="./tribute-engine.js?b=34"></script>
  </body>
</html>
